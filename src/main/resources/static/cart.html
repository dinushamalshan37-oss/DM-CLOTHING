<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart | DM Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <a href="index.html" class="logo">DM CLOTHING</a>

    <nav class="main-nav">
        <a href="index.html">SHOP</a>
        <a href="index.html#shop">SHIRTS</a>
        <a href="index.html#shop">SHORTS</a>
        <a href="index.html#shop">PANTS</a>
        <a href="index.html#shop">CAPS</a>
        <a href="index.html#shop">SHOES</a>
    </nav>

    <div class="header-actions">
        <a href="login.html">CUSTOMER</a>
        <a href="owner.html">OWNER</a>
        <a href="cart.html">CART</a>
    </div>
</header>

<section class="pro-cart-page">
    <div class="cart-title">
        <h1>SHOPPING CART</h1>
        <p>Review your selected DM Clothing items before checkout.</p>
    </div>

    <div class="cart-layout">
        <div id="cartItems" class="pro-cart-items"></div>

        <div class="pro-cart-summary">
            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <b>LKR <span id="cartTotal">0</span></b>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <b>LKR 399</b>
            </div>

            <hr>

            <div class="summary-total">
                <span>Total</span>
                <b>LKR <span id="grandTotal">0</span></b>
            </div>

            <button class="checkout-btn" onclick="goToCheckout()">PROCEED TO CHECKOUT</button>
            <button class="clear-btn" onclick="clearCart()">CLEAR CART</button>

            <a class="continue-link" href="index.html">← Continue Shopping</a>
        </div>
    </div>
</section>

<script>
const API_URL = "http://localhost:8080/api";
const customerId = localStorage.getItem("customerId");

if (!customerId) {
    alert("Please login first");
    window.location.href = "login.html";
}

loadCart();

async function loadCart() {
    const cartRes = await fetch(`${API_URL}/cart/customer/${customerId}`);
    const cartItems = await cartRes.json();

    const productRes = await fetch(`${API_URL}/products`);
    const products = await productRes.json();

    const cartBox = document.getElementById("cartItems");
    const totalBox = document.getElementById("cartTotal");
    const grandTotalBox = document.getElementById("grandTotal");

    cartBox.innerHTML = "";
    let total = 0;

    if (cartItems.length === 0) {
        cartBox.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Add products from the shop collection.</p>
                <a href="index.html">SHOP NOW</a>
            </div>
        `;
        totalBox.innerText = "0";
        grandTotalBox.innerText = "0";
        return;
    }

    cartItems.forEach(item => {
        const product = products.find(p => p.productId === item.productId);

        if (!product) return;

        const subtotal = product.price * item.quantity;
        total += subtotal;

        cartBox.innerHTML += `
            <div class="pro-cart-item">
                <div class="cart-img-box">
                    <img src="${product.image}" 
                         alt="${product.productName}"
                         onerror="this.src='https://placehold.co/300x300/f2f2f2/111?text=DM+CLOTHING'">
                </div>

                <div class="cart-info">
                    <h2>${product.productName}</h2>
                    <p>${product.category}</p>

                    <div class="cart-tags">
                        <span>Color: ${item.selectedColor}</span>
                        <span>Size: ${item.selectedSize}</span>
                        <span>Qty: ${item.quantity}</span>
                    </div>

                    <h3>LKR ${Number(product.price).toLocaleString()}.00</h3>
                    <h4>Subtotal: LKR ${Number(subtotal).toLocaleString()}.00</h4>
                </div>

                <button class="remove-btn" onclick="removeItem(${item.cartId})">REMOVE</button>
            </div>
        `;
    });

    totalBox.innerText = Number(total).toLocaleString();
    grandTotalBox.innerText = Number(total + 399).toLocaleString();
}

function removeItem(cartId) {
    fetch(`${API_URL}/cart/${cartId}`, {
        method: "DELETE"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        loadCart();
    });
}

function clearCart() {
    fetch(`${API_URL}/cart/clear/${customerId}`, {
        method: "DELETE"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        loadCart();
    });
}

function goToCheckout() {
    window.location.href = "checkout.html";
}
</script>

</body>
</html>
